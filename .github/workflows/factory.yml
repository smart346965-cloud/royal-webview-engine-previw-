name: Royal Cloud Factory 👑

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: 'رابط الموقع (Target App URL)'
        required: true
        default: 'https://bellroy.com/'
      app_name:
        description: 'اسم التطبيق (App Name)'
        required: false
        default: 'Royal App'
      app_id:
        description: 'معرف التطبيق (App ID)'
        required: false
        default: 'com.royal.app'

  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 📥
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 36 📱
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Execute Permission for Gradle 🔑
        run: chmod +x gradlew

      - name: Auto-Generate Ephemeral Production Keystore 🔐
        run: |
          set -euo pipefail
          echo "🔑 Generating self-signed temporary keystore for build..."
          
          KEYSTORE_PASS="RoyalAutoSecretPass123"
          KEY_ALIAS="royal_alias"
          KEY_PASS="RoyalAutoSecretPass123"

          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=RoyalEngine, OU=Mobile, O=Royal, L=City, ST=State, C=US"

          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          echo "✅ Ephemeral keystore created and verified successfully."

      - name: Verify Build Toolchain 🛠️
        run: |
          echo "========== JAVA =========="
          java -version
          echo "========== GRADLE =========="
          ./gradlew --version

      - name: Build Signed APK & AAB 🚀
        run: |
          INJECTED_URL="${{ github.event.inputs.test_url || github.event.client_payload.url || 'https://bellroy.com/' }}"
          APP_ID="${{ github.event.inputs.app_id || github.event.client_payload.appId || 'com.royal.app' }}"

          echo "🔥 Injecting Target URL: $INJECTED_URL | App ID: $APP_ID"

          ./gradlew clean assembleRelease bundleRelease --no-build-cache \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }} \
            -PCLIENT_URL="$INJECTED_URL"

      - name: Extract REAL SHA256 Fingerprint 🔐
        run: |
          SHA256_HEX=$(keytool -list -v -keystore release-key.jks -storepass "${{ env.KEYSTORE_PASSWORD }}" -alias "${{ env.KEY_ALIAS }}" | grep "SHA256:" | awk '{print $2}')
          echo "========================================================"
          echo "🔥 بصمة الشهادة المستخدمة في توقيع هذا الإصدار:"
          echo "SHA256: $SHA256_HEX"
          echo "========================================================"

      - name: Upload Final Signed APK 📦
        uses: actions/upload-artifact@v4
        with:
          name: Royal-App-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Final Signed AAB (App Bundle) 📦
        uses: actions/upload-artifact@v4
        with:
          name: Royal-App-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
